name: Update M3U Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时运行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  update-m3u:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行器

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5 # 【关键】升级到 v5 以支持更新的 Node.js 环境
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run fetch script
        run: |
          # 设置环境变量以兼容旧版 Node.js 动作（如果仍有警告）
          export ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true
          python fetch_m3u.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update m3u playlist" && git push)
