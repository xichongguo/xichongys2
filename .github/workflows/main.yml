名称namename: 每日自动运行yuan.py

on:
  schedule:
    # 每天 UTC 22:00 运行，对应北京时间早上 6:00
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动点击按钮触发运行（方便测试）

jobs:
  run-script:
    runs-on: ubuntu-latest  # 在最新的 Ubuntu 环境中运行

    steps:
      # 1. 拉取你的仓库代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖库（如果没有 requirements.txt，可以删掉下面这3行）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 运行你的 Python 脚本
      - name: 执行yuan.py脚本
        run: python yuan.py

      # 5. 将脚本生成的文件保存下来（GitHub Actions 运行完会销毁环境，必须上传才能保留文件）
      - name: 上传生成的文件
        uses: actions/upload-artifact@v4
        with:
          name: output-files
          path: ./*
          retention-days: 5
