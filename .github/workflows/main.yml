name: 每日自动运行yuan.py

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 已经删掉了“安装依赖”的步骤

      - name: 执行yuan.py脚本
        run: python yuan.py

      - name: 上传生成的文件
        uses: actions/upload-artifact@v4
        with:
          name: output-files
          path: ./*
          retention-days: 5
