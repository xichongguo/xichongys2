名称name: 每日自动运行yuan.py

on:
  schedule:
    - cron: '0 22 * * *'  # 对应北京时间每天早上 6:00
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的仓库代码
      - 名称: 拉取代码
        使用：actions/checkout@v4

      # 2. 配置 Python 环境
      - 名称: 配置 Python
        使用：actions/setup-python@v5
        与：
          python-version: '3.10'  # 你可以根据需要修改Python版本

      # 3. 安装依赖库
      - 名称: 安装依赖
        运行： |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # 如果没有依赖，可以删除这一行

      # 4. 运行你的 Python 脚本
      - 名称: 执行yuan.py脚本
        运行： python yuan.py

      # 5. 将脚本生成的文件保存下来（GitHub Actions 运行完会销毁环境，必须上传才能保留文件）
      - 名称: 上传生成的文件
        uses: actions/upload-artifact@v4
        with:
          name: output-files  # 在 Actions 页面下载时显示的压缩包名称
          path: ./*           # 指定要上传的文件路径，这里默认上传根目录下的所有文件
          retention-days: 5   # 文件保留天数（最长可设90天）
