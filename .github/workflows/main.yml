name: 自动更新直播源

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0点运行一次
  workflow_dispatch:      # 允许手动触发测试

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出你的代码仓库
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 必须加上这个，否则后面无法推送代码
          persist-credentials: false 

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 安装依赖并运行你的脚本
      - name: Install dependencies and run script
        run: |
          pip install requests
          python fetch_m3u.py

      # 4. 自动提交并推送生成的 m3u 文件到仓库
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add migu.m3u
          # 只有当文件有变动时才提交，避免无意义的空提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update migu.m3u" && git push https://${{ secrets.GITHUB_TOKEN }}@github.com/xichongguo/xichongys2.git HEAD:main)
