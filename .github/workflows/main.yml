name: Run Yuan Script

# 1. 定义触发条件：代码推送到 main 或 master 分支时自动运行
on:
  push:
    branches: [ "main", "master" ]
  # 允许在网页上手动点击运行
  workflow_dispatch:

# 2. 定义任务（jobs）：这是必须包含的顶层属性
jobs:
  build:
    # 指定运行环境为最新的 Ubuntu
    runs-on: ubuntu-latest

    # 3. 定义步骤（steps）：必须放在 jobs 里面的具体任务下
    steps:
    # 步骤1：拉取你的代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 步骤2：设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 步骤3：安装依赖库（解决 requests 缺失的问题）
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 步骤4：运行你的 Python 脚本
    - name: Run yuan.py
      run: python yuan.py

    # 步骤5：(可选) 上传生成的 output.m3u8 文件，方便你下载
    - name: Upload M3U8 artifact
      uses: actions/upload-artifact@v4
      with:
        name: iptv-output
        path: output.m3u8
