name: Fetch M3U Playlist

# 定义触发条件
on:
  schedule:
    # 每天北京时间 00:00 自动运行 (GitHub 默认使用 UTC 时间，这里 16:00 对应北京时间 00:00)
    - cron: '0 16 * * *'
  # 允许手动点击按钮触发
  workflow_dispatch:

# 定义具体的工作任务 (报错提示缺少的正是这个部分)
jobs:
  fetch-m3u:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取你的仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装 requests 依赖库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 运行你的 Python 脚本
      - name: Run fetch script
        run: python -u fetch_m3u.py

      # 5. 将生成的 m3u 文件提交并推送到 GitHub 仓库
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add migu.m3u
          # 只有当文件有变动时才提交，避免无意义的空提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update migu.m3u" && git push)
