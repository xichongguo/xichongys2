name: 自动更新直播源

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0点（北京时间早上8点）运行一次
  workflow_dispatch:      # 允许在网页上手动点击运行

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出你的代码仓库（使用默认配置，保留 GITHUB_TOKEN 凭据）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 安装依赖并运行你的 Python 脚本
      - name: Install dependencies and run script
        run: |
          pip install requests
          python fetch_m3u.py

      # 4. 自动提交并推送生成的 m3u 文件到仓库
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add migu.m3u
          
          # 只有当文件有变动时才提交，避免无意义的空提交
          if ! git diff --quiet && ! git diff --staged --quiet; then
            git commit -m "Auto update migu.m3u"
            # 使用 GITHUB_TOKEN 进行身份验证推送
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/xichongguo/xichongys2.git HEAD:main
          else
            echo "文件没有变动，跳过提交。"
          fi
