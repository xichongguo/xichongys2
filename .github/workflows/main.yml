name: 自动更新直播源

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0点（北京时间早上8点）运行
  workflow_dispatch:      # 允许手动触发

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    # 赋予工作流写入仓库的权限（这是最关键的一步！）
    permissions:
      contents: write

    steps:
      # 1. 检出代码（使用默认配置，不要加 persist-credentials: false）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 安装依赖并运行 Python 脚本
      - name: Install dependencies and run script
        run: |
          pip install requests
          python fetch_m3u.py

      # 4. 强制重置远程地址并提交推送
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add migu.m3u
          
          # 只有当文件有变动时才提交
          if ! git diff --quiet && ! git diff --staged --quiet; then
            git commit -m "Auto update migu.m3u"
            # 核心改动：先强制设置带有 GITHUB_TOKEN 的远程仓库地址，再推送
            git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/xichongguo/xichongys2.git
            git push origin HEAD:main
          else
            echo "文件没有变动，跳过提交。"
          fi
