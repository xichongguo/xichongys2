    steps:
    # 1. 拉取代码
    - uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 【关键步骤】安装依赖库（解决 ModuleNotFoundError 的核心）
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # 这里会自动读取并安装 requests

    # 4. 运行你的 Python 脚本
    - name: Run yuan.py
      run: python yuan.py
